name: Playground Integration

on:
  push:
    branches:
      - playground-integration
  pull_request:
    branches:
      - main
      - playground-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: image-playground/package-lock.json
      - name: Install dependencies
        working-directory: image-playground
        run: npm ci
      - name: Run Playground tests
        working-directory: image-playground
        run: npm test -- --run
      - name: Build Playground
        working-directory: image-playground
        run: npm run build
      - name: Copy Playground into Sub2API frontend
        run: |
          rm -rf frontend/public/gpt-image-playground
          mkdir -p frontend/public/gpt-image-playground
          cp -a image-playground/dist/. frontend/public/gpt-image-playground/
      - name: Upload embedded Playground
        uses: actions/upload-artifact@v7
        with:
          name: gpt-image-playground-dist
          path: frontend/public/gpt-image-playground/
          retention-days: 1

  frontend:
    needs: playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/download-artifact@v8
        with:
          name: gpt-image-playground-dist
          path: frontend/public/gpt-image-playground/
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run integration view tests
        working-directory: frontend
        run: pnpm test:run src/views/user/__tests__/ImagePlaygroundView.spec.ts
      - name: Build Sub2API frontend
        working-directory: frontend
        run: pnpm build
      - name: Upload embedded frontend
        uses: actions/upload-artifact@v7
        with:
          name: sub2api-frontend-dist
          path: backend/internal/web/dist/
          retention-days: 1

  backend-embed:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: sub2api-frontend-dist
          path: backend/internal/web/dist/
      - name: Test security headers
        working-directory: backend
        run: go test ./internal/server/middleware -run TestSecurityHeaders -count=1
      - name: Test embedded web routing
        working-directory: backend
        run: go test -tags embed ./internal/web -run TestFrontendServer_Middleware -count=1
      - name: Build embedded Sub2API binary
        working-directory: backend
        run: |
          CGO_ENABLED=0 go build -tags embed \
            -ldflags="-s -w -X main.Version=playground-ci -X main.Commit=${GITHUB_SHA}-playground -X main.BuildType=release" \
            -o ../bin/sub2api-playground ./cmd/server
      - name: Upload integration binary
        uses: actions/upload-artifact@v7
        with:
          name: sub2api-playground-linux-amd64
          path: bin/sub2api-playground
          retention-days: 7
